<!DOCTYPE html>
<!-- Side 1. The record is spinning. What is being sent, and to whom? -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STATION NULL // RECORD</title>
  <style>
    :root{
      --phosphor: #37ff6c;
      --tube: #061006;
    }

    *{ margin:0; padding:0; box-sizing:border-box; }
    html, body{ height:100%; }

    body{
      background:#000;
      overflow:hidden;
      min-height:100vh;
    }

    /* ---- The tube ---- */
    .crt{
      position:relative;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(ellipse at center, #0b1a0b 0%, var(--tube) 62%, #000 100%);
      box-shadow: inset 0 0 160px 40px rgba(0,0,0,0.9),
                  inset 0 0 90px 10px rgba(55,255,108,0.05);
      transform-origin: center;
      animation: power-on 1.15s ease-out both;
    }
    .crt::after{
      content:"";
      position:absolute; inset:0;
      z-index:6; pointer-events:none;
      background:radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,0.6) 100%);
    }

    /* ---- The photo ---- */
    .screen{
      position:relative;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      animation: signal-in 1.9s steps(1) both;
    }
    .feed{
      display:block;
      max-width:92vw;
      max-height:90vh;
      width:auto; height:auto;
      object-fit:contain;
      /* golden bloom so the artifact sits inside the glass */
      filter: drop-shadow(0 0 24px rgba(255,205,90,0.14)) contrast(1.03) saturate(1.05);
    }

    /* ---- Overlays ---- */
    .scanlines{
      position:absolute; inset:0;
      z-index:4; pointer-events:none;
      /* lighter than the text page so the photo stays clear */
      background:repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0)    0px,
        rgba(0,0,0,0)    2px,
        rgba(0,0,0,0.20) 3px,
        rgba(0,0,0,0.20) 4px
      );
    }
    .scanlines::before{
      content:"";
      position:absolute; left:0; right:0;
      height:26vh; top:-30vh;
      background:linear-gradient(to bottom,
        rgba(55,255,108,0)    0%,
        rgba(55,255,108,0.045) 50%,
        rgba(55,255,108,0)    100%);
      animation: roll 8s linear infinite;
    }
    .flicker{
      position:absolute; inset:0;
      z-index:5; pointer-events:none;
      background:rgba(10,20,10,0.10);
      opacity:0;
      animation: flicker 0.12s infinite steps(1);
    }

    /* ---- Keyframes ---- */
    @keyframes power-on{
      0%   { opacity:0; transform:scaleY(0.006) scaleX(1.35); filter:brightness(4) blur(1px); }
      14%  { opacity:1; transform:scaleY(0.006) scaleX(1);     filter:brightness(4); }
      34%  { transform:scaleY(1) scaleX(1);                     filter:brightness(2.2); }
      55%  { filter:brightness(0.65); }
      72%  { filter:brightness(1.35); }
      100% { filter:brightness(1); }
    }
    @keyframes signal-in{
      0%, 46% { opacity:0; }
      47%     { opacity:0.35; }
      49%     { opacity:0.08; }
      53%     { opacity:0.9; }
      61%     { opacity:0.4; }
      100%    { opacity:1; }
    }
    @keyframes roll{
      0%   { top:-30vh; }
      100% { top:100%; }
    }
    @keyframes flicker{
      0%{opacity:0.10;} 20%{opacity:0.02;} 40%{opacity:0.14;}
      60%{opacity:0.04;} 80%{opacity:0.09;} 100%{opacity:0.03;}
    }

    @media (prefers-reduced-motion: reduce){
      .crt, .screen{ animation:none; }
      .scanlines::before, .flicker{ animation:none; opacity:0; }
    }
  </style>
</head>
<body>
  <main class="crt">
    <div class="screen">
      <img class="feed" src="sounds-of-earth.jpg"
           alt="The Voyager Golden Record — The Sounds of Earth">
    </div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="flicker" aria-hidden="true"></div>
  </main>
</body>
</html>
