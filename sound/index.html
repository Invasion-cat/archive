<!DOCTYPE html>
<!-- Sound is just a picture you are playing too fast. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STATION NULL // SIGNAL</title>
  <style>
    :root{
      --phosphor: #37ff6c;
      --phosphor-dim: #1f9c45;
      --tube: #061006;
    }

    *{ margin:0; padding:0; box-sizing:border-box; }
    html, body{ height:100%; }

    body{
      background:#000;
      color:var(--phosphor);
      font-family: ui-monospace, "Cascadia Mono", "SF Mono", "Consolas", "Courier New", monospace;
      overflow:hidden;
      min-height:100vh;
    }

    /* ---- The tube ---- */
    .crt{
      position:relative;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(ellipse at center, #0b1a0b 0%, var(--tube) 62%, #000 100%);
      box-shadow: inset 0 0 160px 40px rgba(0,0,0,0.9),
                  inset 0 0 90px 10px rgba(55,255,108,0.06);
      transform-origin: center;
      animation: power-on 1.15s ease-out both;
    }
    .crt::after{
      content:"";
      position:absolute; inset:0;
      z-index:6; pointer-events:none;
      background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
    }

    /* ---- The panel ---- */
    .screen{
      position:relative;
      z-index:2;
      width:min(680px, 88vw);
      padding:2rem;
      animation: text-in 1.9s steps(1) both;
    }
    .line{
      font-size:clamp(1rem, 2.6vw, 1.45rem);
      line-height:1.85;
      letter-spacing:0.05em;
      text-shadow: 0 0 4px rgba(55,255,108,0.75),
                   0 0 12px rgba(55,255,108,0.45),
                   0 0 26px rgba(55,255,108,0.18);
    }
    .carrier{
      color:#c9ffd8;
      text-shadow: 1px 0 2px rgba(255,60,60,0.35),
                  -1px 0 2px rgba(60,120,255,0.35),
                   0 0 6px rgba(55,255,108,0.9),
                   0 0 18px rgba(55,255,108,0.5);
      margin-bottom:1.1rem;
    }

    /* ---- Player ---- */
    .panel{
      margin-top:1.8rem;
      display:flex;
      flex-direction:column;
      gap:1.2rem;
    }
    .transport{
      display:flex;
      align-items:center;
      gap:1rem;
    }
    .track{
      position:relative;
      flex:1;
      height:16px;
      border:1px solid rgba(55,255,108,0.55);
      cursor:pointer;
      overflow:hidden;
    }
    .track::before{
      /* faint scanline texture inside the bar */
      content:""; position:absolute; inset:0;
      background:repeating-linear-gradient(to bottom,
        rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.35) 2px, rgba(0,0,0,0.35) 3px);
      pointer-events:none;
    }
    .fill{
      height:100%; width:0%;
      background:var(--phosphor);
      box-shadow:0 0 10px rgba(55,255,108,0.8);
    }
    .time{
      font-size:0.9rem;
      font-variant-numeric:tabular-nums;
      min-width:5.5rem;
      text-align:right;
      color:var(--phosphor-dim);
    }
    .actions{ display:flex; flex-wrap:wrap; gap:1rem; }

    .btn{
      appearance:none;
      font:inherit;
      cursor:pointer;
      color:var(--phosphor);
      background:rgba(55,255,108,0.05);
      border:1px solid var(--phosphor);
      padding:0.7rem 1.2rem;
      letter-spacing:0.08em;
      text-decoration:none;
      text-shadow:0 0 6px rgba(55,255,108,0.6);
      transition:background 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover{
      background:rgba(55,255,108,0.16);
      box-shadow:0 0 14px rgba(55,255,108,0.35);
    }
    .btn:focus-visible{
      outline:2px solid #c9ffd8;
      outline-offset:2px;
    }

    /* ---- Overlays ---- */
    .scanlines{
      position:absolute; inset:0;
      z-index:4; pointer-events:none;
      background:repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0)   0px,
        rgba(0,0,0,0)   2px,
        rgba(0,0,0,0.30) 3px,
        rgba(0,0,0,0.30) 4px
      );
    }
    .scanlines::before{
      content:"";
      position:absolute; left:0; right:0;
      height:26vh; top:-30vh;
      background:linear-gradient(to bottom,
        rgba(55,255,108,0)    0%,
        rgba(55,255,108,0.05) 50%,
        rgba(55,255,108,0)    100%);
      animation: roll 8s linear infinite;
    }
    .flicker{
      position:absolute; inset:0;
      z-index:5; pointer-events:none;
      background:rgba(10,20,10,0.10);
      opacity:0;
      animation: flicker 0.12s infinite steps(1);
    }

    /* ---- Keyframes ---- */
    @keyframes power-on{
      0%   { opacity:0; transform:scaleY(0.006) scaleX(1.35); filter:brightness(4) blur(1px); }
      14%  { opacity:1; transform:scaleY(0.006) scaleX(1);     filter:brightness(4); }
      34%  { transform:scaleY(1) scaleX(1);                     filter:brightness(2.2); }
      55%  { filter:brightness(0.65); }
      72%  { filter:brightness(1.35); }
      100% { filter:brightness(1); }
    }
    @keyframes text-in{
      0%, 46% { opacity:0; }
      47%     { opacity:0.35; }
      49%     { opacity:0.08; }
      53%     { opacity:0.9; }
      61%     { opacity:0.4; }
      100%    { opacity:1; }
    }
    @keyframes roll{ 0%{ top:-30vh; } 100%{ top:100%; } }
    @keyframes flicker{
      0%{opacity:0.10;} 20%{opacity:0.02;} 40%{opacity:0.14;}
      60%{opacity:0.04;} 80%{opacity:0.09;} 100%{opacity:0.03;}
    }

    @media (prefers-reduced-motion: reduce){
      .crt, .screen{ animation:none; }
      .scanlines::before, .flicker{ animation:none; opacity:0; }
    }
  </style>
</head>
<body>
  <main class="crt">
    <div class="screen">
      <p class="line carrier">SIGNAL INTERCEPTED</p>
      <p class="line">Play it if you want. Some transmissions are meant to be seen, not heard.</p>

      <div class="panel">
        <div class="transport">
          <button class="btn" id="play" aria-label="Play signal">&#9654;&nbsp;PLAY</button>
          <div class="track" id="track" role="slider" aria-label="Seek"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="fill" id="fill"></div>
          </div>
          <span class="time" id="time">0:00 / 0:00</span>
        </div>
        <div class="actions">
          <a class="btn" id="download" href="secret-sound.wav" download="STATION_NULL_signal.wav">&#10515;&nbsp;DOWNLOAD SIGNAL</a>
        </div>
      </div>

      <audio id="sig" src="secret-sound.wav" preload="metadata"></audio>
    </div>

    <div class="scanlines" aria-hidden="true"></div>
    <div class="flicker" aria-hidden="true"></div>
  </main>

  <script>
    (function () {
      var audio = document.getElementById('sig');
      var playBtn = document.getElementById('play');
      var track = document.getElementById('track');
      var fill = document.getElementById('fill');
      var timeEl = document.getElementById('time');
      if (!audio || !playBtn || !track || !fill || !timeEl) return;

      function fmt(s) {
        if (!isFinite(s)) s = 0;
        var m = Math.floor(s / 60);
        var sec = Math.floor(s % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
      }
      function render() {
        var dur = audio.duration || 0;
        var cur = audio.currentTime || 0;
        var pct = dur ? (cur / dur) * 100 : 0;
        fill.style.width = pct + '%';
        track.setAttribute('aria-valuenow', Math.round(pct));
        timeEl.textContent = fmt(cur) + ' / ' + fmt(dur);
      }
      function setLabel(playing) {
        playBtn.innerHTML = playing ? '&#10074;&#10074;&nbsp;PAUSE' : '&#9654;&nbsp;PLAY';
        playBtn.setAttribute('aria-label', playing ? 'Pause signal' : 'Play signal');
      }

      playBtn.addEventListener('click', function () {
        if (audio.paused) { audio.play(); } else { audio.pause(); }
      });
      audio.addEventListener('play', function () { setLabel(true); });
      audio.addEventListener('pause', function () { setLabel(false); });
      audio.addEventListener('ended', function () { setLabel(false); audio.currentTime = 0; render(); });
      audio.addEventListener('timeupdate', render);
      audio.addEventListener('loadedmetadata', render);

      function seekFromClientX(clientX) {
        var rect = track.getBoundingClientRect();
        var ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        if (isFinite(audio.duration)) audio.currentTime = ratio * audio.duration;
      }
      track.addEventListener('click', function (e) { seekFromClientX(e.clientX); });
      track.addEventListener('keydown', function (e) {
        if (!isFinite(audio.duration)) return;
        if (e.key === 'ArrowRight') { audio.currentTime = Math.min(audio.duration, audio.currentTime + 1); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { audio.currentTime = Math.max(0, audio.currentTime - 1); e.preventDefault(); }
        else if (e.key === ' ' || e.key === 'Enter') { playBtn.click(); e.preventDefault(); }
      });

      render();
    })();
  </script>
</body>
</html>
