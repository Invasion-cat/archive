<!DOCTYPE html>
<!-- Aphex knew. Look at the sound. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STATION NULL // VAULT</title>
  <style>
    :root{
      --phosphor: #37ff6c;
      --phosphor-dim: #1f9c45;
      --tube: #061006;
    }

    *{ margin:0; padding:0; box-sizing:border-box; }
    html, body{ height:100%; }

    body{
      background:#000;
      color:var(--phosphor);
      font-family: ui-monospace, "Cascadia Mono", "SF Mono", "Consolas", "Courier New", monospace;
      overflow:hidden;
      min-height:100vh;
    }

    /* ---- The tube ---- */
    .crt{
      position:relative;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(ellipse at center, #0b1a0b 0%, var(--tube) 62%, #000 100%);
      box-shadow: inset 0 0 160px 40px rgba(0,0,0,0.9),
                  inset 0 0 90px 10px rgba(55,255,108,0.06);
      transform-origin: center;
      animation: power-on 1.15s ease-out both;
    }
    .crt::after{
      content:"";
      position:absolute; inset:0;
      z-index:6; pointer-events:none;
      background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
    }

    /* ---- The text ---- */
    .screen{
      position:relative;
      z-index:2;
      width:min(760px, 88vw);
      padding:2rem;
      animation: text-in 1.9s steps(1) both;
    }
    .line{
      font-size:clamp(1rem, 2.6vw, 1.45rem);
      line-height:1.85;
      letter-spacing:0.05em;
      text-shadow: 0 0 4px rgba(55,255,108,0.75),
                   0 0 12px rgba(55,255,108,0.45),
                   0 0 26px rgba(55,255,108,0.18);
    }
    .line + .line{ margin-top:0.35rem; }

    .carrier{
      color:#c9ffd8;
      text-shadow: 1px 0 2px rgba(255,60,60,0.35),
                  -1px 0 2px rgba(60,120,255,0.35),
                   0 0 6px rgba(55,255,108,0.9),
                   0 0 18px rgba(55,255,108,0.5);
      margin-bottom:1.3rem;
    }

    /* the target path — brighter so players spot it, plain text (not a link) on purpose */
    .path{
      color:#c9ffd8;
      user-select:all;
      text-shadow:0 0 6px rgba(55,255,108,0.9), 0 0 16px rgba(55,255,108,0.5);
    }

    .cursor{
      display:inline-block;
      transform: translateY(1px);
      margin-left:3px;
      animation: blink 1.05s steps(1) infinite;
    }

    /* ---- Overlays ---- */
    .scanlines{
      position:absolute; inset:0;
      z-index:4; pointer-events:none;
      background:repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0)   0px,
        rgba(0,0,0,0)   2px,
        rgba(0,0,0,0.30) 3px,
        rgba(0,0,0,0.30) 4px
      );
    }
    .scanlines::before{
      content:"";
      position:absolute; left:0; right:0;
      height:26vh; top:-30vh;
      background:linear-gradient(to bottom,
        rgba(55,255,108,0)    0%,
        rgba(55,255,108,0.05) 50%,
        rgba(55,255,108,0)    100%);
      animation: roll 8s linear infinite;
    }
    .flicker{
      position:absolute; inset:0;
      z-index:5; pointer-events:none;
      background:rgba(10,20,10,0.10);
      opacity:0;
      animation: flicker 0.12s infinite steps(1);
    }

    /* ---- Keyframes ---- */
    @keyframes power-on{
      0%   { opacity:0; transform:scaleY(0.006) scaleX(1.35); filter:brightness(4) blur(1px); }
      14%  { opacity:1; transform:scaleY(0.006) scaleX(1);     filter:brightness(4); }
      34%  { transform:scaleY(1) scaleX(1);                     filter:brightness(2.2); }
      55%  { filter:brightness(0.65); }
      72%  { filter:brightness(1.35); }
      100% { filter:brightness(1); }
    }
    @keyframes text-in{
      0%, 46% { opacity:0; }
      47%     { opacity:0.35; }
      49%     { opacity:0.08; }
      53%     { opacity:0.9; }
      61%     { opacity:0.4; }
      100%    { opacity:1; }
    }
    @keyframes roll{
      0%   { top:-30vh; }
      100% { top:100%; }
    }
    @keyframes blink{ 50%{ opacity:0; } }
    @keyframes flicker{
      0%{opacity:0.10;} 20%{opacity:0.02;} 40%{opacity:0.14;}
      60%{opacity:0.04;} 80%{opacity:0.09;} 100%{opacity:0.03;}
    }

    @media (prefers-reduced-motion: reduce){
      .crt, .screen{ animation:none; }
      .scanlines::before, .flicker{ animation:none; opacity:0; }
      .cursor{ animation:none; }
    }
  </style>
</head>
<body>
  <main class="crt">
    <div class="screen">
      <p class="line carrier">LETTER: C</p>
      <p class="line">The last test is a sound you must see. Some pictures only appear when you look at sound.</p>
      <p class="line">Listen: <span class="path">invasion-cat.github.io/archive/sound</span><span class="cursor">&#9608;</span></p>
    </div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="flicker" aria-hidden="true"></div>
  </main>
</body>
</html>
